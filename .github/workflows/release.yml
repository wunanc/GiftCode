name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.get_tag.outputs.TAG }}
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          mvn clean package -PBuildFull=false
          mvn package -PBuildFull=true

      - name: Stage artifacts
        run: |
          mkdir -p staging
          mv target/*.jar staging/

      - name: Get tag version
        id: get_tag
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: staging/
          retention-days: 1

  release-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: staging

      - name: Create GitHub Release
        run: |
          TAG="${{ needs.build.outputs.TAG }}"
          VERSION_NUMBER="${TAG#v}"

          gh release create "$TAG" \
            staging/GiftCode-*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION_NUMBER" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-modrinth:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: staging

      - name: Publish to Modrinth
        uses: dsx137/modrinth-releaser@main
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          name: ${{ needs.build.outputs.TAG }}
          project_id: ozJTYG4R
          loaders: folia,paper,purpur
          game_versions: 1.20.1:1.21.11, 26.1.2:26.2
          version_number: ${{ needs.build.outputs.TAG }}
          files: |
            staging/GiftCode-*.jar
          changelog: "See https://github.com/wunanc/GiftCode/releases/tag/${{ needs.build.outputs.TAG }}"
          version_type: release
          featured: false