name: opencode-review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: |
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ secrets.AI_MODEL }}
          use_github_token: true
          prompt: |
            Review this pull request.

            Please respond entirely in Simplified Chinese.
            All explanations, findings, suggestions, and comments must be written in Simplified Chinese.

            Please check:
            - Code quality issues
            - Potential bugs
            - Security issues
            - Performance issues
            - Potential compatibility issues

            For each issue:
            - Clearly explain the problem
            - Explain why it is a problem
            - Give a concrete suggestion for improvement

            If there are no significant issues, say so in Simplified Chinese.
